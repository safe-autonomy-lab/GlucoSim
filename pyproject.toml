[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glucosim"
version = "0.1.0"
description = "JAX-based diabetes simulation environments with cost-aware wrappers for safe RL."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Minjae Kwon"}]
dependencies = [
  "numpy>=1.26",
  "jax>=0.6",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "gymnasium>=1.2",
]

[project.optional-dependencies]
# OmniSafe CMDP wrapper (glucosim.diabetes_cmdp)
omnisafe = ["torch", "omnisafe", "stable-baselines3"]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/safe-autonomy-lab/GlucoSim"
Paper = "https://openreview.net/forum?id=kSUGLBHd0T"

[tool.setuptools.packages.find]
where = ["."]
include = ["glucosim*"]

[tool.setuptools.package-data]
"glucosim.simglucose.params" = ["*.csv"]
